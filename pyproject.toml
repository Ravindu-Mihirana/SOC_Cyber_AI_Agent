[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-cyber-ai-agent"
version = "0.1.0"
description = "A scanner-agnostic security findings orchestrator proof of concept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2.0",
    "streamlit>=1.40,<2.0",
    "reportlab>=4.2,<5.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
soc-cyber-nmap = "soc_cyber_agent.nmap_server:main"
soc-cyber-scan = "soc_cyber_agent.orchestrator:main"
soc-cyber-ui = "soc_cyber_agent.launch_ui:main"

[tool.setuptools.packages.find]
where = ["src"]
